[project]
name = "calbot"
version = "0.1.0"
description = "Private Telegram bot that turns natural language into Google Calendar actions"
requires-python = ">=3.11"
dependencies = [
    "anthropic==1.11.0",
    "python-telegram-bot==22.8",
    "pydantic==2.13.5",
    "pydantic-settings==2.15.0",
    "google-api-python-client==2.201.0",
    "google-auth==2.59.1",
    "google-auth-oauthlib==1.5.0",
    "python-dateutil==2.9.0.post0",
    "tzdata==2026.5",
]

[project.optional-dependencies]
dev = ["pytest==9.1.1", "pytest-asyncio==1.4.0"]

[project.scripts]
calbot = "calbot.main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/calbot"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
pythonpath = ["src"]
testpaths = ["tests"]
markers = ["eval: scripted conversations against the real Claude API (needs ANTHROPIC_API_KEY)"]
